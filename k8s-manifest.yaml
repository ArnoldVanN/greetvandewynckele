apiVersion: apps/v1
kind: Deployment
metadata:
  name: greetvandewynckele-deployment
  namespace: greetvandewynckele
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greetvandewynckele
  template:
    metadata:
      labels:
        app: greetvandewynckele
    spec:
      containers:
        - name: greetvandewynckele
          image: ghcr.io/arnoldvann/greetvandewynckele:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: greetvandewynckele-svc
  namespace: greetvandewynckele
spec:
  type: NodePort
  selector:
    app: greetvandewynckele
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-sa
  namespace: greetvandewynckele
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: greetvandewynckele
  name: ci
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greetvdw-ci-sa-binding
  namespace: greetvandewynckele
subjects:
  - kind: ServiceAccount
    name: ci-sa
    namespace: greetvandewynckele
roleRef:
  kind: Role
  name: ci
  apiGroup: rbac.authorization.k8s.io
