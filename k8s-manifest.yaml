apiVersion: apps/v1
kind: Deployment
metadata:
  name: greetvandewynckele-deployment
  namespace: greetvandewynckele
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greetvandewynckele
  template:
    metadata:
      labels:
        app: greetvandewynckele
    spec:
      containers:
        - name: greetvandewynckele
          image: ghcr.io/arnoldvann/greetvandewynckele:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: greetvandewynckele-svc
  namespace: greetvandewynckele
spec:
  selector:
    app: greetvandewynckele
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greetvdw-httproute
  namespace: greetvandewynckele
spec:
  parentRefs:
    - name: greetvdw-gw
      namespace: ingress
  hostnames:
    - "greetvandewynckele.com"
    - "*.greetvandewynckele.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: greetvandewynckele-svc
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: greetvdw-gw
  namespace: ingress
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: greetvandewynckele
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-sa
  namespace: greetvandewynckele
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: greetvandewynckele
  name: ci
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greetvdw-ci-sa-binding
  namespace: greetvandewynckele
subjects:
  - kind: ServiceAccount
    name: ci-sa
    namespace: greetvandewynckele
roleRef:
  kind: Role
  name: ci
  apiGroup: rbac.authorization.k8s.io
